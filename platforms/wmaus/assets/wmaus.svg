<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-wmaus d-wmaus">
  <title id="t-wmaus">WMAUS wristband ultrasound platform</title>
  <desc id="d-wmaus">Stylised illustration of the WMAUS wearable multichannel A-mode ultrasound system: a black wristband hosting a blue PCB with eight yellow transducer elements and a dsPIC33 DSP chip.</desc>
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a2e40"/>
      <stop offset="1" stop-color="#0d1c2a"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00629b"/>
      <stop offset="1" stop-color="#003e63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>
  <!-- wristband -->
  <g transform="translate(120,210)">
    <rect x="0" y="0" width="560" height="120" rx="60" fill="url(#band)"/>
    <rect x="20" y="20" width="520" height="80" rx="40" fill="#0d1c2a"/>
    <!-- pcb -->
    <rect x="60" y="35" width="430" height="50" rx="6" fill="url(#pcb)"/>
    <!-- 8 transducer elements -->
    <g fill="#ffd166">
      <circle cx="90" cy="60" r="14"/>
      <circle cx="140" cy="60" r="14"/>
      <circle cx="190" cy="60" r="14"/>
      <circle cx="240" cy="60" r="14"/>
      <circle cx="290" cy="60" r="14"/>
      <circle cx="340" cy="60" r="14"/>
      <circle cx="390" cy="60" r="14"/>
      <circle cx="440" cy="60" r="14"/>
    </g>
    <!-- dsPIC chip -->
    <rect x="455" y="48" width="32" height="24" fill="#1a2e40" stroke="#ffd166" stroke-width="1.2"/>
    <text x="471" y="64" font-family="Inter,Arial" font-size="9" fill="#ffd166" text-anchor="middle">DSP</text>
  </g>
  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="120" font-size="34" font-weight="800" text-anchor="middle">WMAUS</text>
    <text x="400" y="148" font-size="16" text-anchor="middle" fill="#51677a">Wristband · 8 A-mode channels · 5 MHz · dsPIC33 DSP</text>
    <text x="400" y="430" font-size="14" text-anchor="middle" fill="#51677a">132 × 90 × 30 mm · 190 g · 3.5 W · 10 h</text>
    <text x="400" y="455" font-size="14" text-anchor="middle" fill="#51677a">Hand-gesture HMI · sEMG hybrid control</text>
  </g>
</svg>
