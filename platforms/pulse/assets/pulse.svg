<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-pulse d-pulse">
  <title id="t-pulse">PuLsE wrist-worn ultrasound heart-rate monitor</title>
  <desc id="d-pulse">Stylised illustration of the PuLsE single-channel wrist-worn ultrasound probe: a small circular transducer head on the underside of a watch-style enclosure with BLE link to a host phone showing heart-rate readout.</desc>
  <defs>
    <linearGradient id="bezel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b4a5a"/>
      <stop offset="1" stop-color="#1a2e40"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0d2a3a"/>
      <stop offset="1" stop-color="#04161e"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2a3a4a"/>
      <stop offset="1" stop-color="#13202c"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5478" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff5478" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>

  <!-- wrist silhouette -->
  <path d="M120 360 Q400 200 680 360 L680 500 L120 500 Z" fill="#f3c5a6" opacity=".4"/>

  <!-- watch strap -->
  <g transform="translate(280,210)">
    <rect x="0" y="0" width="240" height="170" rx="36" fill="url(#bezel)" stroke="#0d1c2a" stroke-width="2"/>
    <rect x="14" y="14" width="212" height="142" rx="26" fill="url(#screen)"/>
    <!-- HR readout -->
    <text x="120" y="68" font-family="ui-monospace, monospace" font-size="13" fill="#7af0a2" text-anchor="middle" font-weight="700">HR</text>
    <text x="120" y="108" font-family="ui-monospace, monospace" font-size="34" fill="#7af0a2" text-anchor="middle" font-weight="800">72</text>
    <text x="120" y="128" font-family="ui-monospace, monospace" font-size="10" fill="#5fa97a" text-anchor="middle">bpm</text>
    <!-- BLE ECG trace -->
    <path d="M28 144 L60 144 L66 134 L72 154 L80 124 L86 144 L120 144 L126 134 L132 154 L140 144 L180 144 L186 134 L192 154 L200 144 L212 144"
          stroke="#7af0a2" stroke-width="1.4" fill="none" opacity=".7"/>
  </g>

  <!-- BLE link to phone -->
  <g transform="translate(560,210)" fill="#00629b">
    <path d="M0 0 L0 -16 L7 -8 Z"/>
    <circle r="5" cx="0" cy="-2" fill="#fff" stroke="#00629b" stroke-width="2"/>
  </g>
  <!-- phone -->
  <g transform="translate(580,180)">
    <rect x="0" y="0" width="80" height="140" rx="10" fill="#1a2e40" stroke="#0d1c2a" stroke-width="2"/>
    <rect x="6" y="20" width="68" height="100" rx="2" fill="#0d2a3a"/>
    <text x="40" y="60" font-family="ui-monospace, monospace" font-size="9" fill="#7af0a2" text-anchor="middle" font-weight="700">HR</text>
    <text x="40" y="84" font-family="ui-monospace, monospace" font-size="22" fill="#7af0a2" text-anchor="middle" font-weight="800">72</text>
    <text x="40" y="100" font-family="ui-monospace, monospace" font-size="7" fill="#5fa97a" text-anchor="middle">bpm</text>
  </g>

  <!-- transducer head (underside, ultrasound beam into wrist) -->
  <g transform="translate(400,420)">
    <ellipse cx="0" cy="0" rx="40" ry="10" fill="#00629b" opacity=".75"/>
    <ellipse cx="0" cy="0" rx="22" ry="5" fill="#0d1c2a"/>
    <!-- downward beam -->
    <path d="M-12 5 L12 5 L18 60 L-18 60 Z" fill="url(#beam)"/>
  </g>

  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="115" font-size="34" font-weight="800" text-anchor="middle">PuLsE</text>
    <text x="400" y="143" font-size="16" text-anchor="middle" fill="#51677a">Single-channel wrist HR monitor · 5.8 mW · 7 days</text>
    <text x="400" y="465" font-size="14" text-anchor="middle" fill="#51677a">STM32L4 + analog envelope · BLE heart-rate · continuous monitoring</text>
  </g>
</svg>
