<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-mouse d-mouse">
  <title id="t-mouse">MoUsE portable POCUS platform</title>
  <desc id="d-mouse">Stylised illustration of the MoUsE portable POCUS unit with display screen showing live parameters, control buttons, USB and Wi-Fi ports, connected via a cable to a 32-channel probe head.</desc>
  <defs>
    <linearGradient id="case" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3b4a5a"/>
      <stop offset="1" stop-color="#1a2e40"/>
    </linearGradient>
    <linearGradient id="head" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#cfd9e3"/>
      <stop offset="1" stop-color="#8fa1b3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>
  <!-- main housing -->
  <g transform="translate(180,160)">
    <rect x="0" y="0" width="440" height="220" rx="22" fill="url(#case)" stroke="#0d1c2a" stroke-width="2"/>
    <!-- display window -->
    <rect x="30" y="30" width="200" height="160" rx="6" fill="#0d1c2a"/>
    <g transform="translate(40,42)">
      <text font-family="ui-monospace, monospace" font-size="10" fill="#7af0a2">PRF 23 Hz</text>
      <text y="14" font-family="ui-monospace, monospace" font-size="10" fill="#7af0a2">32 ch · 50 MS/s</text>
      <text y="28" font-family="ui-monospace, monospace" font-size="10" fill="#7af0a2">12 W</text>
      <!-- mini b-mode sector -->
      <path d="M40 60 L160 60 L130 130 L70 130 Z" fill="#0c2236"/>
      <g fill="#7af0a2" opacity=".7">
        <circle cx="100" cy="90" r="3"/>
        <circle cx="115" cy="100" r="2"/>
        <circle cx="92" cy="115" r="2.5"/>
        <circle cx="125" cy="118" r="2"/>
      </g>
    </g>
    <!-- buttons -->
    <g fill="#00629b">
      <circle cx="270" cy="60" r="10"/>
      <circle cx="270" cy="100" r="10"/>
      <circle cx="270" cy="140" r="10"/>
      <circle cx="270" cy="180" r="10"/>
    </g>
    <!-- USB / power -->
    <rect x="320" y="60" width="90" height="22" rx="4" fill="#51677a"/>
    <text x="365" y="76" font-family="Inter,Arial" font-size="12" fill="#fff" text-anchor="middle">USB</text>
    <rect x="320" y="100" width="90" height="22" rx="4" fill="#51677a"/>
    <text x="365" y="116" font-family="Inter,Arial" font-size="12" fill="#fff" text-anchor="middle">Wi-Fi</text>
    <!-- LED -->
    <circle cx="365" cy="155" r="6" fill="#7af0a2"/>
    <text x="365" y="180" font-family="Inter,Arial" font-size="9" fill="#cfd9e3" text-anchor="middle">PWR</text>
  </g>
  <!-- probe cable -->
  <path d="M620 270 Q700 320 760 280" fill="none" stroke="#1a2e40" stroke-width="6"/>
  <rect x="745" y="255" width="35" height="55" rx="6" fill="url(#head)" stroke="#1a2e40" stroke-width="2"/>
  <text x="763" y="288" font-family="Inter,Arial" font-size="9" fill="#1a2e40" text-anchor="middle">32ch</text>
  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="430" font-size="34" font-weight="800" text-anchor="middle">MoUsE</text>
    <text x="400" y="458" font-size="14" text-anchor="middle" fill="#51677a">32-channel POCUS · Zynq-7000 FPGA · 184 × 123 × 33 mm · 12 W</text>
  </g>
</svg>
