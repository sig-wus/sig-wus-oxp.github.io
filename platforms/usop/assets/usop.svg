<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-usop d-usop">
  <title id="t-usop">USoP flexible wearable ultrasound imager</title>
  <desc id="d-usop">Stylised illustration of the USoP flexible 32-channel ultrasound imaging probe on a thin PCB with a PIC32 MCU and Wi-Fi antenna.</desc>
  <defs>
    <linearGradient id="flex" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dfe7f0"/>
      <stop offset="1" stop-color="#b9c8d6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>
  <g transform="translate(120,230)">
    <rect x="0" y="0" width="560" height="100" rx="50" fill="url(#flex)" stroke="#7a8a9a" stroke-width="2"/>
    <!-- 32 elements -->
    <g fill="#00629b">
      <g>
        <rect x="20" y="20" width="10" height="60" rx="2"/>
      </g>
      <rect x="35" y="20" width="10" height="60" rx="2"/>
      <rect x="50" y="20" width="10" height="60" rx="2"/>
      <rect x="65" y="20" width="10" height="60" rx="2"/>
      <rect x="80" y="20" width="10" height="60" rx="2"/>
      <rect x="95" y="20" width="10" height="60" rx="2"/>
      <rect x="110" y="20" width="10" height="60" rx="2"/>
      <rect x="125" y="20" width="10" height="60" rx="2"/>
      <rect x="140" y="20" width="10" height="60" rx="2"/>
      <rect x="155" y="20" width="10" height="60" rx="2"/>
      <rect x="170" y="20" width="10" height="60" rx="2"/>
      <rect x="185" y="20" width="10" height="60" rx="2"/>
      <rect x="200" y="20" width="10" height="60" rx="2"/>
      <rect x="215" y="20" width="10" height="60" rx="2"/>
      <rect x="230" y="20" width="10" height="60" rx="2"/>
      <rect x="245" y="20" width="10" height="60" rx="2"/>
    </g>
    <!-- MCU + flex PCB region -->
    <rect x="280" y="20" width="180" height="60" rx="6" fill="#1a2e40"/>
    <text x="370" y="58" font-family="Inter,Arial" font-size="16" fill="#ffd166" text-anchor="middle">PIC32 MCU</text>
    <!-- wifi -->
    <g transform="translate(490,30)" fill="#00629b">
      <path d="M0 20 a20 20 0 0 1 40 0"/>
      <path d="M5 20 a15 15 0 0 1 30 0"/>
      <path d="M10 20 a10 10 0 0 1 20 0"/>
      <circle cx="20" cy="20" r="3"/>
    </g>
    <text x="520" y="80" font-family="Inter,Arial" font-size="11" fill="#00629b" text-anchor="middle">Wi-Fi</text>
  </g>
  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="130" font-size="34" font-weight="800" text-anchor="middle">USoP</text>
    <text x="400" y="158" font-size="16" text-anchor="middle" fill="#51677a">Flexible 32-channel wearable imager · 6 MHz · PIC32 MCU</text>
    <text x="400" y="420" font-size="14" text-anchor="middle" fill="#51677a">≈100 × 30 × 5 mm · 0.614 W · 12 h · 31 Hz</text>
    <text x="400" y="445" font-size="14" text-anchor="middle" fill="#51677a">Mobile blood-pressure monitoring</text>
  </g>
</svg>
