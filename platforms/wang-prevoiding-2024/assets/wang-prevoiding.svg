<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-wang d-wang">
  <title id="t-wang">Wang Pre-Voiding Alarm</title>
  <desc id="d-wang">Stylised illustration of the Wang et al. 11-element wearable ultrasound array for pediatric nocturnal-enuresis pre-voiding alarm, with alarm-bell icon.</desc>
  <defs>
    <linearGradient id="wp-band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1a2e40"/>
      <stop offset="1" stop-color="#0d1c2a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>

  <!-- 11-element array strip -->
  <g transform="translate(120,210)">
    <rect x="0" y="0" width="560" height="80" rx="14" fill="url(#wp-band)" stroke="#0d1c2a" stroke-width="2"/>
    <g fill="#62c8e8">
      <rect x="20" y="20" width="36" height="40" rx="4"/>
      <rect x="68" y="20" width="36" height="40" rx="4"/>
      <rect x="116" y="20" width="36" height="40" rx="4"/>
      <rect x="164" y="20" width="36" height="40" rx="4"/>
      <rect x="212" y="20" width="36" height="40" rx="4"/>
      <rect x="260" y="20" width="36" height="40" rx="4"/>
      <rect x="308" y="20" width="36" height="40" rx="4"/>
      <rect x="356" y="20" width="36" height="40" rx="4"/>
      <rect x="404" y="20" width="36" height="40" rx="4"/>
      <rect x="452" y="20" width="36" height="40" rx="4"/>
      <rect x="500" y="20" width="36" height="40" rx="4"/>
    </g>
    <text x="40" y="74" font-family="ui-monospace, monospace" font-size="11" fill="#62c8e8">2 MHz, 5-bit Barker</text>
  </g>

  <!-- alarm bell icon -->
  <g transform="translate(400,360)" fill="#ffb547" stroke="#1a2e40" stroke-width="2">
    <path d="M-30 -10 Q-30 -40 0 -40 Q30 -40 30 -10 L35 5 L-35 5 Z"/>
    <rect x="-12" y="5" width="24" height="6" fill="#1a2e40" stroke="none"/>
    <circle cx="0" cy="20" r="6"/>
  </g>

  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="115" font-size="34" font-weight="800" text-anchor="middle">Wang Pre-Voiding Alarm</text>
    <text x="400" y="143" font-size="16" text-anchor="middle" fill="#51677a">11-element wearable array · 2 MHz · coded excitation</text>
    <text x="400" y="430" font-size="14" text-anchor="middle" fill="#51677a">Barker-coded 5-bit · Arduino Due + PC · pre-void alarm for nocturnal enuresis</text>
  </g>
</svg>
