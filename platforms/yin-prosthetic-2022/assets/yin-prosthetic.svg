<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-yin d-yin">
  <title id="t-yin">Yin prosthetic-control wristband — image placeholder</title>
  <desc id="d-yin">SIG-WUS placeholder image. The primary publication (Yin et al., IEEE JBHI 2022) is closed-access and no reproducible figure is available yet; this neutral branded placeholder marks the spot until one is obtained.</desc>
  <defs>
    <linearGradient id="swx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6ea8"/>
      <stop offset="1" stop-color="#0b3a5c"/>
    </linearGradient>
    <linearGradient id="swx-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc1ea" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7cc1ea" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#swx-bg)"/>
  <!-- subtle ultrasound arc motif -->
  <g fill="none" stroke="url(#swx-wave)" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M400 330 Q460 270 520 330"/>
    <path d="M370 355 Q460 265 550 355"/>
    <path d="M340 380 Q460 260 580 380"/>
  </g>
  <!-- brand mark, centered -->
  <g transform="translate(400 205)">
    <rect x="-52" y="-52" width="104" height="104" rx="24" fill="#0b3a5c" stroke="#7cc1ea" stroke-width="2.5"/>
    <g fill="none" stroke="#7cc1ea" stroke-width="4.5" stroke-linecap="round">
      <path d="M-30 12 Q-22 4 -14 12"/>
      <path d="M-38 24 Q-22 6 -6 24"/>
      <path d="M-46 36 Q-22 10 2 36"/>
    </g>
    <path d="M14 -18 q-14 10 -14 25 a14 14 0 0 0 28 0 q0 -15 -14 -25 z" fill="#ffffff"/>
    <circle cx="14" cy="7" r="5" fill="#0b6ea8"/>
  </g>
  <g font-family="Inter, Arial" text-anchor="middle">
    <text x="400" y="310" font-size="30" font-weight="800" fill="#ffffff">Yin Prosthetic Wristband</text>
    <text x="400" y="342" font-size="17" fill="#c9e6f5">Image pending — no reproducible figure available yet</text>
    <text x="400" y="366" font-size="15" fill="#9fc6de">Yin et al., IEEE J. Biomed. Health Inform., 2022 · DOI 10.1109/JBHI.2022.3203084</text>
    <text x="400" y="462" font-size="13" letter-spacing="2.5" font-weight="700" fill="#7cc1ea">SIG-WUS X-CHANGE PLATFORM</text>
  </g>
</svg>
