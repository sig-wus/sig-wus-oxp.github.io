<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t-yin d-yin">
  <title id="t-yin">Yin Prosthetic Wristband</title>
  <desc id="d-yin">Stylised illustration of the Yin et al. 4-channel ultrasound wristband integrated into a prosthetic socket, with forearm muscle ultrasound beam and attached prosthetic hand.</desc>
  <defs>
    <linearGradient id="band-y" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a4a5a"/>
      <stop offset="1" stop-color="#1a2e40"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="#eaf1f7"/>

  <!-- forearm cross-section -->
  <ellipse cx="200" cy="260" rx="120" ry="60" fill="#f3c5a6" stroke="#cda287" stroke-width="2"/>
  <g stroke="#c99070" stroke-width="1" fill="none" opacity=".5">
    <path d="M120 240 Q200 220 280 240"/>
    <path d="M120 280 Q200 300 280 280"/>
  </g>

  <!-- wristband -->
  <g transform="translate(150,220)">
    <rect x="0" y="0" width="120" height="80" rx="14" fill="url(#band-y)" stroke="#0d1c2a" stroke-width="2"/>
    <!-- 4 transducer elements -->
    <g fill="#ffd166">
      <circle cx="20" cy="40" r="10"/>
      <circle cx="50" cy="40" r="10"/>
      <circle cx="80" cy="40" r="10"/>
      <circle cx="110" cy="40" r="10"/>
    </g>
    <rect x="45" y="58" width="36" height="16" fill="#00629b"/>
  </g>

  <!-- ultrasound beam into forearm -->
  <path d="M155 220 Q200 230 245 220 L260 280 L140 280 Z" fill="#00629b" opacity=".15"/>

  <!-- prosthetic arm/hand -->
  <g transform="translate(300,190)">
    <rect x="0" y="20" width="200" height="50" rx="20" fill="#cfd9e3" stroke="#7a8a9a" stroke-width="2"/>
    <rect x="180" y="0" width="20" height="90" fill="#cfd9e3" stroke="#7a8a9a" stroke-width="2"/>
    <!-- fingers -->
    <g fill="#cfd9e3" stroke="#7a8a9a" stroke-width="2">
      <rect x="200" y="-40" width="14" height="50" rx="6"/>
      <rect x="216" y="-50" width="14" height="60" rx="6"/>
      <rect x="232" y="-40" width="14" height="50" rx="6"/>
      <rect x="248" y="-30" width="14" height="40" rx="6"/>
    </g>
    <!-- joint -->
    <circle cx="180" cy="45" r="6" fill="#1a2e40"/>
  </g>

  <g font-family="Inter, Arial" fill="#1a2e40">
    <text x="400" y="120" font-size="34" font-weight="800" text-anchor="middle">Yin Prosthetic Wristband</text>
    <text x="400" y="148" font-size="16" text-anchor="middle" fill="#51677a">4 ch. A-mode wristband · STM32F7 · prosthetic hand control</text>
    <text x="400" y="420" font-size="14" text-anchor="middle" fill="#51677a">85 g (excl. battery) · 3.5 h operation · ±50 V, 1 MHz</text>
    <text x="400" y="445" font-size="14" text-anchor="middle" fill="#51677a">Real-time prosthetic hand control from forearm muscle activity</text>
  </g>
</svg>
